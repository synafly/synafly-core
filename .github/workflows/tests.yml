name: Python research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/demo_continuity.py --out .cache/ci/continuity.json
      - run: python3 scripts/verify_history.py .cache/ci/checkpoints.json
      - run: python3 scripts/benchmark.py --out .cache/ci/ablation
