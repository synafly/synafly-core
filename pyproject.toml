[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synafly-lab"
version = "0.2.0"
description = "Read-only RPC edge, controlled topology experiments and verifiable state continuity"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools.packages.find]
include = ["synafly_lab*"]
