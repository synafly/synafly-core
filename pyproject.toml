[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synafly-lab"
version = "0.1.0"
description = "Reproducible connectome-state continuity and peer-recovery research"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools.packages.find]
include = ["synafly_lab*"]
